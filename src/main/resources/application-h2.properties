# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:petflowdb;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Flyway Configuration - FORÇANDO A EXECUÇÃO
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false
spring.flyway.clean-disabled=false
spring.flyway.clean-on-validation-error=true

# Logs do Flyway
logging.level.org.flywaydb=DEBUG

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Cache
spring.cache.type=simple

# Swagger
springdoc.swagger-ui.path=/swagger
springdoc.api-docs.path=/api-docs

# JWT
jwt.secret=52825ec77cdd7c835308c0ebe71191da5fed88eb6015ac16b3898571562d549a
jwt.expiration-ms=86400000

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console