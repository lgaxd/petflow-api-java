spring.datasource.url=jdbc:h2:mem:petflowdb;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.cache.type=simple
springdoc.swagger-ui.path=/swagger
springdoc.api-docs.path=/api-docs

# JWT - valor fixo aqui só porque este perfil e' de desenvolvimento local (H2 em memoria).
# Nunca reutilize este secret em producao.
jwt.secret=52825ec77cdd7c835308c0ebe71191da5fed88eb6015ac16b3898571562d549a
jwt.expiration-ms=86400000
