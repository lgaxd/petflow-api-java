<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PetFlow — Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="center-page">
    <div class="card auth-card">
      <h1>🐾 PetFlow</h1>
      <p class="section-sub">Saúde preventiva, gamificação e recompensas para o seu pet.</p>

      <form id="loginForm">
        <label for="email">E-mail</label>
        <input type="email" id="email" required placeholder="voce@exemplo.com">

        <label for="password">Senha</label>
        <input type="password" id="password" required placeholder="••••••••">

        <button type="submit" class="primary" style="width:100%">Entrar</button>
      </form>

      <div id="msg" class="msg" style="display:none"></div>

      <p class="helper-link">Ainda não tem conta? <a href="register.html">Cadastre-se</a></p>

      <div class="card" style="margin-top:18px; background:#f7f9f8; font-size:0.78rem; color:var(--muted);">
        <strong>Usuários de demonstração</strong> (criados pela migration V2):<br>
        Admin: admin@petflow.com / Admin@123<br>
        Tutor: maria@petflow.com / Tutor@123
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    // Se já estiver logado, manda direto pro dashboard correto
    (function redirectIfLogged() {
      const user = Auth.getUser();
      if (user && Auth.getToken()) {
        window.location.href = user.role === "ADMIN" ? "admin.html" : "tutor.html";
      }
    })();

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      hideMessage("msg");

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        const data = await Api.post("/auth/login", { email, password });
        Auth.setSession(data.token, {
          id: data.id, name: data.name, email: data.email, role: data.role
        });
        window.location.href = data.role === "ADMIN" ? "admin.html" : "tutor.html";
      } catch (err) {
        showMessage("msg", err.message || "Não foi possível fazer login.");
      }
    });
  </script>
</body>
</html>
