<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PetFlow — Criar conta</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="center-page">
    <div class="card auth-card">
      <h1>Criar conta de tutor</h1>
      <p class="section-sub">Leva menos de um minuto.</p>

      <form id="registerForm">
        <label for="name">Nome completo</label>
        <input type="text" id="name" required maxlength="100">

        <label for="email">E-mail</label>
        <input type="email" id="email" required maxlength="100">

        <label for="phone">Telefone</label>
        <input type="text" id="phone" maxlength="20" placeholder="(11) 99999-0000">

        <label for="password">Senha</label>
        <input type="password" id="password" required minlength="8"
               placeholder="mín. 8 caracteres, com letra e número">

        <button type="submit" class="primary" style="width:100%">Criar conta</button>
      </form>

      <div id="msg" class="msg" style="display:none"></div>

      <p class="helper-link">Já tem conta? <a href="index.html">Fazer login</a></p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      hideMessage("msg");

      const payload = {
        name: document.getElementById("name").value.trim(),
        email: document.getElementById("email").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        password: document.getElementById("password").value
      };

      try {
        await Api.request("/tutors", { method: "POST", body: payload, auth: false });
        showMessage("msg", "Conta criada com sucesso! Redirecionando para o login...", "success");
        setTimeout(() => window.location.href = "index.html", 1400);
      } catch (err) {
        const validation = err.details?.validationErrors;
        const firstError = validation ? Object.values(validation)[0] : null;
        showMessage("msg", firstError || err.message || "Não foi possível criar a conta.");
      }
    });
  </script>
</body>
</html>
